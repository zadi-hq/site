<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You're on the list | Zadi</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/zadi-mark.png">
<link rel="apple-touch-icon" href="assets/zadi-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--ink:#14233C; --coral:#DA382B; --coral-light:#FF8274; --ivory:#FAF8F4; --ivory-mute:#A9B3BF; --line-dark:rgba(250,248,244,.14)}
  *{box-sizing:border-box; margin:0}
  body{
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:var(--ink); color:var(--ivory); font-size:17px; line-height:1.7;
    min-height:100vh; display:grid; place-items:center; padding:24px;
    -webkit-font-smoothing:antialiased;
  }
  .card{max-width:520px; text-align:center}
  .mark{width:64px; height:64px; border-radius:16px; margin:0 auto 28px; display:block}
  h1{font-family:"Fraunces",Georgia,serif; font-weight:600; font-size:clamp(2rem,6vw,2.8rem)}
  p{color:var(--ivory-mute); margin-top:16px; font-size:1.05rem}
  a.btn{
    display:inline-block; margin-top:32px; padding:14px 28px; border-radius:999px;
    background:var(--coral); color:#FFFFFF; text-decoration:none; font-weight:600;
  }
  a.plain{color:var(--coral-light)}
</style>
</head>
<body>
  <div class="card">
    <img class="mark" src="assets/zadi-mark.png" alt="Zadi">
    <h1>You're on the list.</h1>
    <p>Thank you. We onboard testers in small batches, and your invite will come from <a class="plain" href="mailto:hello@zadi.ae">hello@zadi.ae</a>, so keep an eye on your inbox.</p>
    <a class="btn" href="index.html">Back to zadi.ae</a>
  </div>
</body>
</html>
